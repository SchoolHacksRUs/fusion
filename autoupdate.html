<iframe id="fusion" style="width:100%;height:600px;border:0;"></iframe>
<script>
fetch('https://raw.githubusercontent.com/SchoolHacksRUs/fusion/refs/heads/main/index.html')
  .then(r => r.text())
  .then(html => {
    const blob = new Blob([html], {type: 'text/html'});
    document.getElementById('fusion').src = URL.createObjectURL(blob);
  });
</script>
