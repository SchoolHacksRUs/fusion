<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Slendytubbies II V2.2</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background-color: black;
      }
      #gameContainer {
        position: absolute;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
      }
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #loading-text {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-weight: bold;
        font-size: 48px;
        font-family: cursive;
        text-align: center;
        white-space: nowrap;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
        z-index: 10;
        pointer-events: none;
        padding: 0 16px;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="gameContainer"></div>

    <script>
      // -------------------------------------------------------------
      //  Raw GitHub base. jsDelivr rejects this repo (or its parts
      //  exceed jsDelivr's size cap), so all assets come from raw GitHub.
      // -------------------------------------------------------------
      var REMOTE_BASE = "https://raw.githubusercontent.com/web-ports/slendytubbies/main/2/";

      var loadingText = document.querySelector("#loading-text");
      let totalBytes = 0;
      let loadedBytes = 0;

      // Intercept fetch so any relative path resolves to raw GitHub.
      var _origFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
        if (url && url.indexOf('http') !== 0 && url.indexOf('blob:') !== 0 && url.indexOf('data:') !== 0) {
          url = REMOTE_BASE + url.replace(/^\.?\/+/, "");
        }
        if (input && input.url && url !== input.url) input = new Request(url, input);
        else if (typeof input === 'string') input = url;
        return _origFetch.call(this, input, init);
      };

      // Fetch a JS file as text and wrap in a blob with the correct MIME.
      // Raw GitHub serves .js as text/plain, which blocks <script src>.
      function loadScriptAsBlob(url) {
        return new Promise(function (resolve, reject) {
          fetch(url)
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
              return r.text();
            })
            .then(function (text) {
              var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
              var s = document.createElement("script");
              s.src = blobUrl;
              s.onload = resolve;
              s.onerror = function () { reject(new Error("Failed to execute " + url)); };
              document.head.appendChild(s);
            })
            .catch(reject);
        });
      }

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          loadingText.textContent = `LOADING... ${mbDone} MB / 298.61 MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }

      // Merge split parts into a Blob with an explicit MIME type.
      // The MIME hint is what makes Unity's loader accept the wasm blob.
      async function mergeFiles(fileParts, cacheKey, mimeType) {
        var cache = null;
        try {
          cache = await caches.open("gash-cache");
          var cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            var blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }
        } catch (e) {
          // Cache API unavailable — proceed without caching.
        }

        var buffers = await Promise.all(fileParts.map(p => fetchWithProgress(p)));
        var mergedBlob = new Blob(buffers, { type: mimeType });

        if (cache) {
          try { await cache.put(cacheKey, new Response(mergedBlob)); } catch (e) {}
        }

        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(REMOTE_BASE + file + ".part" + i);
        }
        return parts;
      }

      (async function () {
        try {
          // 1) Load UnityLoader.js as a blob.
          await loadScriptAsBlob(REMOTE_BASE + "Build/UnityLoader.js");

          // 2) Merge the split payloads with explicit MIME types.
          const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(getParts("Build/Build.data.unityweb", 1, 14), "Build.data.unityweb", "application/octet-stream"),
            mergeFiles(getParts("Build/Build.asm.code.unityweb", 1, 2), "Build.asm.code.unityweb", "application/javascript"),
          ]);

          // 3) Intercept XHR so the loader serves the merged payloads
          //    instead of trying to fetch the split parts from the page origin.
          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (typeof url === "string") {
              if (url.includes("Build.asm.code.unityweb")) {
                url = wasmUrl;
              } else if (url.includes("Build.data.unityweb")) {
                url = dataUrl;
              }
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          // 4) Fetch the JSON manifest, rewrite payload URLs to our blob
          //    URLs, and pass the patched JSON to UnityLoader.
          var jsonRes = await fetch(REMOTE_BASE + "Build/Build.json");
          if (!jsonRes.ok) throw new Error("HTTP " + jsonRes.status + " for Build.json");
          var buildJson = await jsonRes.json();
          if (buildJson.dataUrl) buildJson.dataUrl = dataUrl;
          if (buildJson.asmCodeUrl) buildJson.asmCodeUrl = wasmUrl;
          var patchedJsonBlob = new Blob([JSON.stringify(buildJson)], { type: "application/json" });
          var patchedJsonUrl = URL.createObjectURL(patchedJsonBlob);

          var unityInstance = UnityLoader.instantiate("gameContainer", patchedJsonUrl);

          if (loadingText.parentNode) loadingText.remove();
        } catch (err) {
          console.error(err);
          loadingText.textContent = "FAILED: " + (err && err.message ? err.message : err);
          loadingText.style.webkitTextFillColor = "#ff5555";
          loadingText.style.color = "#ff5555";
          loadingText.style.background = "none";
        }
      })();
    </script>
  </body>
</html>
