		<!-- ============================================================
		     DEBUG LOGGER — installed first so it wraps fetch/XHR
		     before any other script runs.

		<script>
		(function () {
			var logBody = null;
			var maxLines = 500;

			function ready(fn) {
				if (document.readyState !== 'loading') fn();
				else document.addEventListener('DOMContentLoaded', fn);
			}

			ready(function () {
				logBody = document.getElementById('log-body');
				var logPanel = document.getElementById('log-panel');
				var logToggle = document.getElementById('log-toggle');

				document.getElementById('log-clear').addEventListener('click', function () {
					logBody.innerHTML = '';
				});
				document.getElementById('log-copy').addEventListener('click', function () {
					var text = logBody.innerText;
					if (navigator.clipboard) {
						navigator.clipboard.writeText(text).then(function () {
							appendLine('Log copied to clipboard.', 'info');
						});
					} else {
						var ta = document.createElement('textarea');
						ta.value = text;
						document.body.appendChild(ta);
						ta.select();
						try { document.execCommand('copy'); appendLine('Log copied.', 'info'); } catch (e) {}
						document.body.removeChild(ta);
					}
				});
				document.getElementById('log-hide').addEventListener('click', function () {
					logPanel.style.display = 'none';
					logToggle.style.display = 'block';
				});
				logToggle.addEventListener('click', function () {
					logPanel.style.display = 'flex';
					logToggle.style.display = 'none';
				});

				appendLine('Logger initialized.', 'info');
				appendLine('location.href: ' + location.href, 'info');
				appendLine('base href: ' + (document.baseURI || '(none)'), 'info');
			});

			function appendLine(text, cls) {
				if (!logBody) {
					if (!appendLine._queue) appendLine._queue = [];
					appendLine._queue.push([text, cls]);
					return;
				}
				if (appendLine._queue && appendLine._queue.length) {
					var q = appendLine._queue;
					appendLine._queue = [];
					q.forEach(function (item) { appendLine(item[0], item[1]); });
				}
				var div = document.createElement('div');
				div.className = 'line' + (cls ? ' ' + cls : '');
				div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
				logBody.appendChild(div);
				while (logBody.children.length > maxLines) logBody.removeChild(logBody.firstChild);
				logBody.scrollTop = logBody.scrollHeight;
			}
			window.__appendLog = appendLine;

			function fmt(x) {
				if (typeof x === 'string') return x;
				if (x instanceof Error) return x.name + ': ' + x.message + (x.stack ? '\n' + x.stack : '');
				try { return JSON.stringify(x); } catch (e) { return String(x); }
			}

			var orig = {
				log: console.log, warn: console.warn,
				error: console.error, info: console.info
			};
			console.log = function () {
				appendLine(Array.prototype.map.call(arguments, fmt).join(' '), '');
				orig.log.apply(console, arguments);
			};
			console.warn = function () {
				appendLine(Array.prototype.map.call(arguments, fmt).join(' '), 'warn');
				orig.warn.apply(console, arguments);
			};
			console.error = function () {
				appendLine(Array.prototype.map.call(arguments, fmt).join(' '), 'error');
				orig.error.apply(console, arguments);
			};
			console.info = function () {
				appendLine(Array.prototype.map.call(arguments, fmt).join(' '), 'info');
				orig.info.apply(console, arguments);
			};

			window.addEventListener('error', function (e) {
				var msg = (e.message || 'unknown error');
				if (e.filename) msg += ' (' + e.filename + ':' + e.lineno + ')';
				appendLine('UNCAUGHT: ' + msg, 'error');
			});
			window.addEventListener('unhandledrejection', function (e) {
				appendLine('UNHANDLED REJECTION: ' + fmt(e.reason), 'error');
			});

			var origFetch = window.fetch ? window.fetch.bind(window) : null;
			if (origFetch) {
				window.fetch = function (input, init) {
					var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
					var shortUrl = url.length > 200 ? url.slice(0, 200) + '…' : url;
					if (url.indexOf('blob:') !== 0) appendLine('FETCH → ' + shortUrl, 'net');
					var t0 = performance.now();
					return origFetch(input, init).then(function (res) {
						var ms = (performance.now() - t0).toFixed(0);
						var len = res.headers.get('Content-Length') || '?';
						var ct  = res.headers.get('Content-Type') || '?';
						if (url.indexOf('blob:') !== 0) {
							if (!res.ok) appendLine('  ← HTTP ' + res.status + ' ' + res.statusText + ' (' + ms + 'ms)', 'error');
							else appendLine('  ← ' + res.status + ' len=' + len + ' ct=' + ct + ' (' + ms + 'ms)', 'ok');
						}
						return res;
					}).catch(function (err) {
						if (url.indexOf('blob:') !== 0) appendLine('  ← NETWORK FAIL: ' + err.message, 'error');
						throw err;
					});
				};
			}

			var OrigXHR = window.XMLHttpRequest;
			function WrappedXHR() {
				var xhr = new OrigXHR();
				var open = xhr.open;
				var send = xhr.send;
				var _url = '';
				xhr.open = function (method, url) {
					_url = String(url);
					var shortUrl = _url.length > 200 ? _url.slice(0, 200) + '…' : _url;
					if (_url.indexOf('blob:') !== 0) appendLine('XHR ' + method + ' → ' + shortUrl, 'net');
					return open.apply(this, arguments);
				};
				xhr.send = function () {
					var t0 = performance.now();
					xhr.addEventListener('loadend', function () {
						var ms = (performance.now() - t0).toFixed(0);
						if (_url.indexOf('blob:') !== 0) {
							var len = '?';
							try {
								if (xhr.responseType === '' || xhr.responseType === 'text') {
									len = xhr.responseText ? xhr.responseText.length : '?';
								} else if (xhr.response) {
									len = xhr.response.byteLength !== undefined ? xhr.response.byteLength : '?';
								}
							} catch (e) { len = '?'; }
							if (xhr.status >= 200 && xhr.status < 300) {
								appendLine('  ← ' + xhr.status + ' len=' + len + ' (' + ms + 'ms)', 'ok');
							} else if (xhr.status === 0) {
								appendLine('  ← XHR status 0 (network error / CORS?)', 'error');
							} else {
								appendLine('  ← HTTP ' + xhr.status + ' ' + xhr.statusText + ' (' + ms + 'ms)', 'error');
							}
						}
					});
					return send.apply(this, arguments);
				};
				return xhr;
			}
			for (var k in OrigXHR) {
				if (Object.prototype.hasOwnProperty.call(OrigXHR, k)) {
					WrappedXHR[k] = OrigXHR[k];
				}
			}
			WrappedXHR.prototype = OrigXHR.prototype;
			window.XMLHttpRequest = WrappedXHR;
		})();
		</script>

		<script>
		(function () {

			var ABS = /^(https?:|blob:|data:|\/\/|about:)/i;

			function rewrite(url) {

			}
			window.__rewrite = rewrite;

			console.info('URL rewriter installed. BASE = ' + REMOTE_BASE);

			if (window.WebAssembly && window.WebAssembly.instantiateStreaming) {

						source = rewrite(source);

				}
			} catch (e) { /* not fatal */ }

			window.Module = window.Module || {};
			window.Module.locateFile = function (path, prefix) {

		<!-- ============================================================
		     CHUNK-MERGE INTERCEPTOR (fetch + XHR)
		     ============================================================ -->
		<script>
		(function () {
			var ORIG_FETCH = window.fetch.bind(window);
			var ORIG_XHR = window.XMLHttpRequest;

			var VIRTUAL_FILES = {
				'index.pck':  true,
				'index.wasm': true
			};

			function virtualName(url) {
				if (typeof url !== 'string') return null;
				var noQuery = url.split('?')[0].split('#')[0];
				var name = noQuery.substring(noQuery.lastIndexOf('/') + 1);
				return VIRTUAL_FILES[name] ? name : null;
			}

			async function fetchParts(baseUrl, name) {
				console.info('Chunk-merge: starting ' + name + ' from ' + baseUrl + '.part*');
				var parts = [];
				for (var i = 1; ; i++) {
					var partUrl = baseUrl + '.part' + i;
					var resp;
					try {
						resp = await ORIG_FETCH(partUrl);
					} catch (e) {
						console.warn('Chunk-merge: network error on ' + partUrl + ' — ' + e.message);
						break;
					}
					if (!resp.ok) {
						console.info('Chunk-merge: stopped at ' + partUrl + ' (HTTP ' + resp.status + ')');
						break;
					}
					var ab = await resp.arrayBuffer();
					parts.push(ab);
					console.info('Chunk-merge: ' + partUrl.split('/').pop() + ' = ' + ab.byteLength + ' bytes');
				}
				var total = parts.reduce(function (s, p) { return s + p.byteLength; }, 0);
				console.info('Chunk-merge: ' + parts.length + ' parts, ' + total + ' bytes total for ' + name);
				var combined = new Uint8Array(total);
				var offset = 0;
				for (var pi = 0; pi < parts.length; pi++) {
					combined.set(new Uint8Array(parts[pi]), offset);
					offset += parts[pi].byteLength;
				}
				return combined;
			}

			window.fetch = function (input, init) {
				var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
				var name = virtualName(url);
				if (name) {
					var base = url.split('?')[0].split('#')[0];
					console.info('Chunk-merge (fetch) intercept: ' + name);
					return fetchParts(base, name).then(function (bytes) {
						console.info('Chunk-merge: returning synthetic Response for ' + name + ' (' + bytes.byteLength + ' bytes)');
						return new Response(bytes, {
							status: 200,
							statusText: 'OK',
							headers: {
								'Content-Type': 'application/octet-stream',
								'Content-Length': String(bytes.byteLength)
							}
						});
					});
				}
				return ORIG_FETCH(input, init);
			};

			function ChunkedXHR() {
				var xhr = new ORIG_XHR();
				var _open = xhr.open;
				var _send = xhr.send;
				var _url = '';
				var _virtualName = null;

				xhr.open = function (method, url) {
					_url = String(url);
					_virtualName = virtualName(_url);
					if (_virtualName) {
						console.info('Chunk-merge (XHR) intercept: ' + _virtualName);
					}
					return _open.apply(this, arguments);
				};

				xhr.send = function () {
					var self = this;
					if (_virtualName) {
						var base = _url.split('?')[0].split('#')[0];
						fetchParts(base, _virtualName).then(function (bytes) {
							var isText = (self.responseType === '' || self.responseType === 'text');
							var buffer = bytes.buffer;
							try {
								Object.defineProperty(self, 'status', { value: 200, configurable: true });
								Object.defineProperty(self, 'statusText', { value: 'OK', configurable: true });
								Object.defineProperty(self, 'readyState', { value: 4, configurable: true });
								Object.defineProperty(self, 'responseURL', { value: _url, configurable: true });
								if (self.responseType === 'arraybuffer') {

								} else if (self.responseType === 'blob') {
									Object.defineProperty(self, 'response', { value: new Blob([bytes]), configurable: true });
								} else if (isText) {
									var text = '';
									for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
									Object.defineProperty(self, 'responseText', { value: text, configurable: true });
									Object.defineProperty(self, 'response', { value: text, configurable: true });
								} else {
									Object.defineProperty(self, 'response', { value: buffer, configurable: true });
								}
							} catch (e) { /* ignore */ }
							console.info('Chunk-merge (XHR): firing synthetic events for ' + _virtualName);
							try {
								self.dispatchEvent(new Event('readystatechange'));
								self.dispatchEvent(new Event('load'));
								self.dispatchEvent(new Event('loadend'));
							} catch (e) { /* ignore */ }
						}).catch(function (err) {
							console.error('Chunk-merge (XHR): fetchParts failed — ' + err.message);
							try {
								Object.defineProperty(self, 'status', { value: 500, configurable: true });
								Object.defineProperty(self, 'readyState', { value: 4, configurable: true });
								self.dispatchEvent(new Event('readystatechange'));
								self.dispatchEvent(new Event('error'));
								self.dispatchEvent(new Event('loadend'));
							} catch (e) {}
						});
						return;
					}
					return _send.apply(this, arguments);
				};

				return xhr;
			}
			for (var k in ORIG_XHR) {
				if (Object.prototype.hasOwnProperty.call(ORIG_XHR, k)) {
					ChunkedXHR[k] = ORIG_XHR[k];
				}
			}
			ChunkedXHR.prototype = ORIG_XHR.prototype;
			window.XMLHttpRequest = ChunkedXHR;

			console.info('Chunk-merge interceptor installed for index.pck, index.wasm (fetch + XHR)');
		})();

		<script>
		(function () {
			var REMOTE_BASE = 'https://raw.githubusercontent.com/Stinkalistic/SWAGgames/main/crankit/';

			function injectScript(name) {
				return new Promise(function (resolve, reject) {
					console.info('Injecting ' + name + '…');
					fetch(name)
						.then(function (r) {
							if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + name);
							return r.text();
						})
						.then(function (text) {
							console.info(name + ' fetched (' + text.length + ' bytes)');
							var blobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
							var s = document.createElement('script');
							s.src = blobUrl;
							s.onload = function () {
								console.info(name + ' executed.');
								resolve();
							};
							s.onerror = function () { reject(new Error(name + ' failed to execute.')); };
							document.body.appendChild(s);
						})
						.catch(reject);
				});
			}

			injectScript('main2.js')
				.then(function () { return injectScript('index.js'); })

						const GODOT_THREADS_ENABLED = false;
						console.info('Creating Engine with executable=' + GODOT_CONFIG.executable);
						const engine = new Engine(GODOT_CONFIG);

						(function () {
							const statusOverlay = document.getElementById('status');
							const statusProgress = document.getElementById('status-progress');
							const statusNotice = document.getElementById('status-notice');

							let initializing = true;
							let statusMode = '';

							function setStatusMode(mode) {
								if (statusMode === mode || !initializing) {
									return;
								}
								if (mode === 'hidden') {
									statusOverlay.remove();
									initializing = false;
									return;
								}
								statusOverlay.style.visibility = 'visible';
								statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
								statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
								statusMode = mode;
							}

							function setStatusNotice(text) {
								while (statusNotice.lastChild) {
									statusNotice.removeChild(statusNotice.lastChild);
								}
								const lines = text.split('\n');
								lines.forEach((line) => {
									statusNotice.appendChild(document.createTextNode(line));
									statusNotice.appendChild(document.createElement('br'));
								});
							}

							function displayFailureNotice(err) {
								console.error('displayFailureNotice: ' + (err && err.message ? err.message : err));
								if (err && err.stack) console.error(err.stack);
								if (err instanceof Error) {
									setStatusNotice(err.message);
								} else if (typeof err === 'string') {
									setStatusNotice(err);
								} else {
									setStatusNotice('An unknown error occurred.');
								}
								setStatusMode('notice');
								initializing = false;
							}

							const missing = Engine.getMissingFeatures({
								threads: GODOT_THREADS_ENABLED,
							});
							console.info('Missing features: ' + JSON.stringify(missing));

							if (missing.length !== 0) {
								const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
								displayFailureNotice(missingMsg + missing.join('\n'));
							} else {
								console.info('Calling engine.startGame…');
								setStatusMode('progress');
								engine.startGame({
									'onProgress': function (current, total) {
										if (current > 0 && total > 0) {
											statusProgress.value = current;
											statusProgress.max = total;
										} else {
											statusProgress.removeAttribute('value');
											statusProgress.removeAttribute('max');
										}
									},
								}).then(() => {
									console.info('engine.startGame resolved — hiding status overlay');
									setStatusMode('hidden');
								}, displayFailureNotice);
							}
						}());
					};

					console.info('Calling godotRunStart…');
					window.godotRunStart();
				})
				.catch(function (err) {
					console.error('Boot failed: ' + (err && err.message ? err.message : err));
					if (err && err.stack) console.error(err.stack);
					var notice = document.getElementById('status-notice');
					if (notice) {
						notice.style.display = 'block';
						notice.textContent = 'Failed to load engine: ' + (err && err.message ? err.message : err);
					}
					document.getElementById('status').style.visibility = 'visible';
				});
		})();
		</script>

		<!-- Debug log panel markup -->
		<div id="log-panel">
			<div id="log-header">
				<span class="title">CRANK IT · DEBUG LOG</span>
				<span id="log-actions">
					<button id="log-clear">Clear</button>
					<button id="log-copy">Copy</button>
					<button id="log-hide">✕</button>
				</span>
			</div>
			<div id="log-body"></div>
		</div>
		<button id="log-toggle">Show Log</button>
	</body>
</html>
