		<script>
		(function () {
			// ============================================================
			// Global path constants
			// ============================================================
			var REMOTE_BASE = 'https://raw.githubusercontent.com/Stinkalistic/SWAGgames/main/crankit/';
			var ABS = /^(https?:|blob:|data:|\/\/|about:)/i;

			function rewrite(url) {
				if (typeof url !== 'string') return url;
				if (ABS.test(url)) return url;
				return REMOTE_BASE + url.replace(/^\.?\/+/, '');
			}
			window.__rewrite = rewrite;

			// ============================================================
			// Patch WebAssembly.instantiateStreaming
			// ============================================================
			if (window.WebAssembly && window.WebAssembly.instantiateStreaming) {
				var origInstantiateStreaming = window.WebAssembly.instantiateStreaming.bind(window.WebAssembly);
				window.WebAssembly.instantiateStreaming = function (source, imports) {
					if (source && typeof source === 'string') {
						source = rewrite(source);
					}
					return origInstantiateStreaming(source, imports);
				};
			}

			// ============================================================
			// Patch HTMLScriptElement.prototype.src setter
			// ============================================================
			try {
				var srcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
				if (srcDesc && srcDesc.set) {
					Object.defineProperty(HTMLScriptElement.prototype, 'src', {
						get: srcDesc.get,
						set: function (v) { return srcDesc.set.call(this, rewrite(v)); },
						configurable: true,
						enumerable: srcDesc.enumerable,
					});
				}
			} catch (e) { /* not fatal */ }

			// ============================================================
			// Pre-seed Module.locateFile
			// ============================================================
			window.Module = window.Module || {};
			window.Module.locateFile = function (path, prefix) {
				if (ABS.test(path)) return path;
				return rewrite(path);
			};
			window.locateFile = window.Module.locateFile;
		})();
		</script>

		<!-- ============================================================
		     CHUNK-MERGE INTERCEPTOR (fetch + XHR)
		     The repo stores index.pck and index.wasm as split files:
		       index.pck.part1, index.pck.part2, ... index.pck.partN
		     This block replaces both fetch() AND XMLHttpRequest for
		     those two filenames. It fetches every part sequentially,
		     stops at the first 404, merges the bytes, and returns a
		     synthetic Response (fetch) or populates the XHR's
		     response/responseText (XHR).
		     ============================================================ -->
		<script>
		(function () {
			var ORIG_FETCH = window.fetch.bind(window);
			var ORIG_XHR = window.XMLHttpRequest;

			var VIRTUAL_FILES = {
				'index.pck':  true,
				'index.wasm': true
			};

			function virtualName(url) {
				if (typeof url !== 'string') return null;
				var noQuery = url.split('?')[0].split('#')[0];
				var name = noQuery.substring(noQuery.lastIndexOf('/') + 1);
				return VIRTUAL_FILES[name] ? name : null;
			}

			async function fetchParts(baseUrl, name) {
				var parts = [];
				for (var i = 1; ; i++) {
					var partUrl = baseUrl + '.part' + i;
					var resp;
					try {
						resp = await ORIG_FETCH(partUrl);
					} catch (e) {
						break;
					}
					if (!resp.ok) break;
					var ab = await resp.arrayBuffer();
					parts.push(ab);
				}
				var total = parts.reduce(function (s, p) { return s + p.byteLength; }, 0);
				var combined = new Uint8Array(total);
				var offset = 0;
				for (var pi = 0; pi < parts.length; pi++) {
					combined.set(new Uint8Array(parts[pi]), offset);
					offset += parts[pi].byteLength;
				}
				return combined;
			}

			// ---- fetch interception ----
			window.fetch = function (input, init) {
				var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
				var name = virtualName(url);
				if (name) {
					var base = url.split('?')[0].split('#')[0];
					return fetchParts(base, name).then(function (bytes) {
						return new Response(bytes, {
							status: 200,
							statusText: 'OK',
							headers: {
								'Content-Type': 'application/octet-stream',
								'Content-Length': String(bytes.byteLength)
							}
						});
					});
				}
				return ORIG_FETCH(input, init);
			};

			// ---- XHR interception ----
			// Godot/Emscripten uses XHR for loading the PCK and WASM in
			// many builds, so we need to short-circuit those too.
			function ChunkedXHR() {
				var xhr = new ORIG_XHR();
				var _open = xhr.open;
				var _send = xhr.send;
				var _url = '';
				var _virtualName = null;

				xhr.open = function (method, url) {
					_url = String(url);
					_virtualName = virtualName(_url);
					return _open.apply(this, arguments);
				};

				xhr.send = function () {
					var self = this;
					if (_virtualName) {
						var base = _url.split('?')[0].split('#')[0];
						fetchParts(base, _virtualName).then(function (bytes) {
							var isText = (self.responseType === '' || self.responseType === 'text');
							var buffer = bytes.buffer;
							try {
								Object.defineProperty(self, 'status', { value: 200, configurable: true });
								Object.defineProperty(self, 'statusText', { value: 'OK', configurable: true });
								Object.defineProperty(self, 'readyState', { value: 4, configurable: true });
								Object.defineProperty(self, 'responseURL', { value: _url, configurable: true });
								if (self.responseType === 'arraybuffer') {
									Object.defineProperty(self, 'response', { value: buffer, configurable: true });
								} else if (self.responseType === 'blob') {
									Object.defineProperty(self, 'response', { value: new Blob([bytes]), configurable: true });
								} else if (isText) {
									var text = '';
									for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
									Object.defineProperty(self, 'responseText', { value: text, configurable: true });
									Object.defineProperty(self, 'response', { value: text, configurable: true });
								} else {
									Object.defineProperty(self, 'response', { value: buffer, configurable: true });
								}
							} catch (e) { /* ignore */ }
							try {
								self.dispatchEvent(new Event('readystatechange'));
								self.dispatchEvent(new Event('load'));
								self.dispatchEvent(new Event('loadend'));
							} catch (e) { /* ignore */ }
						}).catch(function (err) {
							try {
								Object.defineProperty(self, 'status', { value: 500, configurable: true });
								Object.defineProperty(self, 'readyState', { value: 4, configurable: true });
								self.dispatchEvent(new Event('readystatechange'));
								self.dispatchEvent(new Event('error'));
								self.dispatchEvent(new Event('loadend'));
							} catch (e) {}
						});
						return;
					}
					return _send.apply(this, arguments);
				};

				return xhr;
			}
			// Copy static constants (UNSENT, OPENED, etc.) onto the wrapper.
			for (var k in ORIG_XHR) {
				if (Object.prototype.hasOwnProperty.call(ORIG_XHR, k)) {
					ChunkedXHR[k] = ORIG_XHR[k];
				}
			}
			ChunkedXHR.prototype = ORIG_XHR.prototype;
			window.XMLHttpRequest = ChunkedXHR;
		})();
		</script>

		<script>
		(function () {
			var REMOTE_BASE = 'https://raw.githubusercontent.com/Stinkalistic/SWAGgames/main/crankit/';

			// ============================================================
			// Script loader: fetch main2.js and index.js as text, inject
			// as blob URLs so sandboxed editors that strip cross-origin
			// <script src> tags still accept them.
			// ============================================================
			function injectScript(name) {
				return new Promise(function (resolve, reject) {
					fetch(name)
						.then(function (r) {
							if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + name);
							return r.text();
						})
						.then(function (text) {
							var blobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
							var s = document.createElement('script');
							s.src = blobUrl;
							s.onload = function () { resolve(); };
							s.onerror = function () { reject(new Error(name + ' failed to execute.')); };
							document.body.appendChild(s);
						})
						.catch(reject);
				});
			}

			// ============================================================
			// Boot sequence: load main2.js, then index.js, then run Godot.
			// ============================================================
			injectScript('main2.js')
				.then(function () { return injectScript('index.js'); })
				.then(function () {
					window.godotRunStart = function() {
						const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":124754088,"index.wasm":36160334},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
						const GODOT_THREADS_ENABLED = false;
						const engine = new Engine(GODOT_CONFIG);

						(function () {
							const statusOverlay = document.getElementById('status');
							const statusProgress = document.getElementById('status-progress');
							const statusNotice = document.getElementById('status-notice');

							let initializing = true;
							let statusMode = '';

							function setStatusMode(mode) {
								if (statusMode === mode || !initializing) {
									return;
								}
								if (mode === 'hidden') {
									statusOverlay.remove();
									initializing = false;
									return;
								}
								statusOverlay.style.visibility = 'visible';
								statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
								statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
								statusMode = mode;
							}

							function setStatusNotice(text) {
								while (statusNotice.lastChild) {
									statusNotice.removeChild(statusNotice.lastChild);
								}
								const lines = text.split('\n');
								lines.forEach((line) => {
									statusNotice.appendChild(document.createTextNode(line));
									statusNotice.appendChild(document.createElement('br'));
								});
							}

							function displayFailureNotice(err) {
								console.error(err);
								if (err instanceof Error) {
									setStatusNotice(err.message);
								} else if (typeof err === 'string') {
									setStatusNotice(err);
								} else {
									setStatusNotice('An unknown error occurred.');
								}
								setStatusMode('notice');
								initializing = false;
							}

							const missing = Engine.getMissingFeatures({
								threads: GODOT_THREADS_ENABLED,
							});

							if (missing.length !== 0) {
								if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
									let serviceWorkerRegistrationPromise;
									try {
										serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
									} catch (err) {
										serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
									}
									Promise.race([
										serviceWorkerRegistrationPromise.then((registration) => {
											if (registration != null) {
												return Promise.reject(new Error('Service worker already exists.'));
											}
											return registration;
										}).then(() => engine.installServiceWorker()),
										new Promise((resolve) => {
											setTimeout(() => resolve(), 2000);
										}),
									]).then(() => {
										window.location.reload();
									}).catch((err) => {
										console.error('Error while registering service worker:', err);
									});
								} else {
									const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
									displayFailureNotice(missingMsg + missing.join('\n'));
								}
							} else {
								setStatusMode('progress');
								engine.startGame({
									'onProgress': function (current, total) {
										if (current > 0 && total > 0) {
											statusProgress.value = current;
											statusProgress.max = total;
										} else {
											statusProgress.removeAttribute('value');
											statusProgress.removeAttribute('max');
										}
									},
								}).then(() => {
									setStatusMode('hidden');
								}, displayFailureNotice);
							}
						}());
					};

					window.godotRunStart();
				})
				.catch(function (err) {
					var notice = document.getElementById('status-notice');
					if (notice) {
						notice.style.display = 'block';
						notice.textContent = 'Failed to load engine: ' + (err && err.message ? err.message : err);
					}
					document.getElementById('status').style.visibility = 'visible';
					console.error(err);
				});
		})();
		</script>
