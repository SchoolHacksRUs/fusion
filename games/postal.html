<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>POSTAL: Play FREE on the web</title>
    <meta property="og:title" content="POSTAL: Play FREE on the web" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playpostal.com/" />
    <meta property="og:image" content="play-postal-free.jpg" />
    <meta property="og:image:secure_url" content="play-postal-free.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="postal logo that says play free on the web" />
    <meta property="og:description" content="Play the original POSTAL game by Running With Scissors for FREE on this website!" />
    <style>
      html {background-color: black; color: red;}
      body {margin:0; padding:0;}
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }
      canvas.emscripten { border: 0px none; background-color: black; }
    </style>
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"></figure>
    <div class="emscripten" id="status">Downloading game files...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1 onclick="requestPointerLock()"></canvas>
    </div>

    <script>
      // -------------------------------------------------------------
      //  Raw GitHub base. jsDelivr rejects this repo or its parts
      //  exceed jsDelivr's size cap, so all assets come from raw GitHub.
      // -------------------------------------------------------------
      var REMOTE_BASE = "https://raw.githubusercontent.com/Stinkalistic/UGS/main/MISC/postal/";

      const statusElement = document.getElementById('status');
      const progressElement = document.getElementById('progress');
      const spinnerElement = document.getElementById('spinner');
      const canvasElement = document.getElementById('canvas');

      // Rewrite any relative URL to the raw GitHub base so any internal
      // fetch inside index.js resolves correctly.
      const _origFetch = window.fetch;
      window.fetch = function (input, init) {
        let url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
        if (url && url.indexOf(REMOTE_BASE) !== 0 && url.indexOf('blob:') !== 0 && url.indexOf('data:') !== 0 && url.indexOf('http') !== 0) {
          url = REMOTE_BASE + url.replace(/^\.?\/+/, "");
        }
        if (input && input.url && url !== input.url) input = new Request(url, input);
        else if (typeof input === "string") input = url;
        return _origFetch.call(this, input, init);
      };

      function mergeFiles(fileParts, cb) {
        return new Promise((resolve, reject) => {
          let buffers = [];
          function fetchPart(index) {
            if (index >= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              resolve(mergedBlob);
              return;
            }
            fetch(fileParts[index])
              .then((response) => {
                if (!response.ok) throw new Error("Failed to load " + fileParts[index] + " (HTTP " + response.status + ")");
                return response.arrayBuffer();
              })
              .then((data) => {
                buffers.push(data);
                cb(index + 1);
                fetchPart(index + 1);
              })
              .catch(reject);
          }
          fetchPart(0);
        });
      }

      function getParts(baseName, total) {
        let parts = [];
        for (let i = 1; i <= total; i++) {
          parts.push(REMOTE_BASE + baseName + ".part" + i);
        }
        return parts;
      }

      async function prepareDataFile() {
        const parts = getParts("index.data", 24);
        statusElement.innerHTML = "Merging data parts (0/24)...";

        const blob = await mergeFiles(parts, (loaded) => {
          statusElement.innerHTML = `Merging data parts (${loaded}/${parts.length})...`;
        });

        return URL.createObjectURL(blob);
      }

      var Module = {
        canvas: canvasElement,
        setStatus(text) {
          statusElement.textContent = text;
        },
        monitorRunDependencies(left) {
          progressElement.hidden = !left;
          if (left) {
            progressElement.value = 100 - left * 20;
          }
        }
      };

      (async () => {
        try {
          const dataUrl = await prepareDataFile();

          const _origFetch2 = window.fetch;
          window.fetch = (input, init) => {
            if (typeof input === "string" && input.endsWith("index.data")) {
              return _origFetch2(dataUrl, init);
            }
            return _origFetch2(input, init);
          };

          // Load index.js as a blob so raw GitHub's text/plain MIME
          // doesn't block execution as <script src>.
          const jsRes = await fetch(REMOTE_BASE + "index.js");
          if (!jsRes.ok) throw new Error("Failed to load index.js (HTTP " + jsRes.status + ")");
          const jsText = await jsRes.text();
          const jsBlobUrl = URL.createObjectURL(new Blob([jsText], { type: "application/javascript" }));

          const script = document.createElement("script");
          script.src = jsBlobUrl;
          script.onerror = function () {
            statusElement.textContent = "Error loading index.js";
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error(err);
          statusElement.textContent = "Error merging data files: " + (err && err.message ? err.message : err);
        }
      })();
    </script>
  </body>

</html>
