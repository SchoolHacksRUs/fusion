<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>The Message From Deep Space</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
      #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #000; }
      #unity-canvas { background: #000; max-width: 100%; max-height: 100%; outline: none; display: block; }
      #bar { width: 320px; height: 12px; margin-top: 14px; border: 1px solid #555; display: none; }
      #barfill { width: 0%; height: 100%; background: #7cc242; }
      #msg { color: #bbb; font: 13px/1.5 system-ui, sans-serif; margin-top: 10px; text-align: center; }
      #credit { position: fixed; right: 10px; bottom: 8px; z-index: 10; color: #8a8a8a; font: 12px/1.4 system-ui, sans-serif; text-align: right; pointer-events: auto; }
      #credit a { color: #7cc242; text-decoration: none; }
      #credit a:hover { text-decoration: underline; }
      #fs { position: fixed; left: 10px; bottom: 8px; z-index: 10; display: none; background: rgba(255,255,255,0.08); color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 6px 12px; cursor: pointer; font: 12px/1 system-ui, sans-serif; }
      #fs:hover { background: rgba(255,255,255,0.18); }
    </style>
    <script>
      (function () {
        window.__webportAllowFullscreen = false;
        var proto = Element.prototype;
        ['requestFullscreen', 'webkitRequestFullscreen',
         'mozRequestFullScreen', 'msRequestFullscreen'].forEach(function (name) {
          var original = proto[name];
          if (!original) { return; }
          proto[name] = function () {
            if (!window.__webportAllowFullscreen) {
              return Promise.resolve();
            }
            window.__webportAllowFullscreen = false;
            try { return original.apply(this, arguments); }
            catch (e) { return Promise.resolve(); }
          };
        });

        var lockOriginal = proto.requestPointerLock;
        if (lockOriginal && !proto.__webportPointerLockWrapped) {
          proto.__webportPointerLockWrapped = true;
          proto.requestPointerLock = function () {
            var el = this, r;
            try { r = lockOriginal.apply(el, arguments); } catch (e) { r = null; }
            if (r && typeof r.catch === 'function') {
              return r.catch(function () {
                var retry = function () {
                  window.removeEventListener('pointerdown', retry, true);
                  try { lockOriginal.call(el); } catch (e2) {}
                };
                window.addEventListener('pointerdown', retry, true);
              });
            }
            return r;
          };
        }
      })();

      window.addEventListener('error', function (e) {
        if (e && e.message && e.message.indexOf('Fullscreen request denied') >= 0) {
          e.stopImmediatePropagation(); e.preventDefault(); return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var m = e && e.reason && (e.reason.message || String(e.reason));
        if (m && m.indexOf('Fullscreen request denied') >= 0) { e.preventDefault(); }
      });
    </script>
  </head>
  <body>
    <div id="wrap">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="bar"><div id="barfill"></div></div>
      <div id="msg">Loading…</div>
    </div>
    <button id="fs" type="button">Fullscreen</button>
    <div id="credit">
      ported by @._.dasher._.<br>
      <a href="https://wasm.rip/" target="_blank" rel="noopener">wasm.rip</a>
    </div>
    <script>
      var MANIFEST = {
        "data": {
          "file": "b69.data.unityweb",
          "parts": [
            "b69.data.unityweb.part000",
            "b69.data.unityweb.part001",
            "b69.data.unityweb.part002"
          ],
          "bytes": 54793830
        },
        "code": {
          "file": "b69.wasm.unityweb",
          "bytes": 8237172
        },
        "framework": {
          "file": "b69.framework.js.unityweb",
          "bytes": 80888
        },
        "loader": {
          "file": "b69.loader.js",
          "bytes": 117365
        }
      };

      // Raw GitHub base. No <base> tag is used because the loader and framework
      // need to be fetched as blobs (raw GitHub serves .js as text/plain, which
      // browsers refuse to execute as <script src> or use as a framework URL).
      var CDN_BASE = "https://raw.githubusercontent.com/dashiellbenton/ports/main/tmfds/";
      var BUILD = CDN_BASE + "Build";

      // Pass the CDN base to the game via query param so the C# level streamer
      // (which resolves bundle URLs against Application.absoluteURL, ignoring
      // <base>) fetches LevelBundles from raw GitHub too.
      {
        var u = new URL(window.location.href);
        if (u.searchParams.get("cdn") !== CDN_BASE) {
          u.searchParams.set("cdn", CDN_BASE);
          history.replaceState(null, "", u.toString());
        }
      }

      var CACHE_KEY = "tmfds-dashiellbenton-ports-tmfds-default";

      var canvas  = document.querySelector("#unity-canvas");
      var bar     = document.querySelector("#bar");
      var barfill = document.querySelector("#barfill");
      var msg     = document.querySelector("#msg");

      function setMsg(t) { msg.textContent = t; }
      function mb(bytes) { return (bytes / 1048576).toFixed(1); }

      var TOTAL = MANIFEST.data.bytes + MANIFEST.framework.bytes + MANIFEST.code.bytes;
      var downloaded = 0;

      function report(label, fromCache) {
        bar.style.display = "block";
        var pct = TOTAL ? downloaded / TOTAL : 0;
        barfill.style.width = (pct * 100).toFixed(1) + "%";
        setMsg((fromCache ? "Loading cached " : "Downloading ") + label + "… " +
               mb(downloaded) + " / " + mb(TOTAL) +
               " MB (" + Math.floor(pct * 100) + "%)");
      }

      var cachePromise = (async function () {
        try {
          if (!window.caches) return null;
          var names = await caches.keys();
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf("tmfds-") === 0 && names[i] !== CACHE_KEY) {
              await caches.delete(names[i]);
            }
          }
          return await caches.open(CACHE_KEY);
        } catch (e) {
          return null;
        }
      })();

      // Assemble a payload (whole file or parts) into a blob URL with an
      // explicit MIME type. The MIME hint is what makes Unity accept the
      // blob as wasm/JS/data regardless of the raw GitHub Content-Type.
      async function assemble(entry, label, mimeType) {
        var urls = entry.parts || [entry.file];
        var cache = await cachePromise;
        var buffers = [];
        for (var i = 0; i < urls.length; i++) {
          var url = BUILD + "/" + urls[i];
          var res = null;
          var fromCache = false;
          if (cache) {
            try {
              res = await cache.match(url);
              fromCache = !!res;
            } catch (e) { res = null; }
          }
          if (!res) {
            res = await fetch(url);
            if (!res.ok) throw new Error("failed to fetch " + url + " (" + res.status + ")");
            if (cache) {
              try { await cache.put(url, res.clone()); } catch (e) { /* quota/opaque */ }
            }
          }
          if (res.body && res.body.getReader) {
            var reader = res.body.getReader();
            while (true) {
              var step = await reader.read();
              if (step.done) break;
              buffers.push(step.value);
              downloaded += step.value.byteLength;
              report(label, fromCache);
            }
          } else {
            var buf = await res.arrayBuffer();
            buffers.push(buf);
            downloaded += buf.byteLength;
            report(label, fromCache);
          }
        }
        return URL.createObjectURL(new Blob(buffers, { type: mimeType }));
      }

      // Fetch a remote JS file as text and wrap it in a blob with the correct
      // MIME type. Required for raw GitHub, which serves .js as text/plain.
      async function fetchAsJsBlob(url) {
        var res = await fetch(url);
        if (!res.ok) throw new Error("failed to fetch " + url + " (" + res.status + ")");
        var text = await res.text();
        return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
      }

      (async function () {
        try {
          var dataUrl      = await assemble(MANIFEST.data, "game data", "application/octet-stream");
          var frameworkUrl = await assemble(MANIFEST.framework, "framework", "application/javascript");
          var codeUrl      = await assemble(MANIFEST.code, "code", "application/wasm");

          setMsg("Loading loader…");
          var loaderUrl = await fetchAsJsBlob(BUILD + "/" + MANIFEST.loader.file);

          setMsg("Starting…");
          await new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = resolve;
            script.onerror = function () { reject(new Error("failed to execute loader")); };
            document.head.appendChild(script);
          });

          createUnityInstance(canvas, {
            dataUrl: dataUrl,
            frameworkUrl: frameworkUrl,
            codeUrl: codeUrl,
            streamingAssetsUrl: CDN_BASE + "StreamingAssets",
            companyName: "Applesinmypants",
            productName: "The Message From Deep Space",
            productVersion: "1.0",
          }, function (p) {
            bar.style.display = "block";
            barfill.style.width = Math.round(p * 100) + "%";
            setMsg("Loading… " + Math.round(p * 100) + "%");
          }).then(function (instance) {
            window.unityInstance = instance;
            bar.style.display = "none";
            setMsg("");
            var fs = document.querySelector("#fs");
            fs.style.display = "block";
            fs.onclick = function () {
              window.__webportAllowFullscreen = true;
              if (instance.SetFullscreen) instance.SetFullscreen(1);
              else if (canvas.requestFullscreen) canvas.requestFullscreen();
              window.__webportAllowFullscreen = false;
              canvas.focus();
            };
          }).catch(function (e) {
            setMsg("Failed to start: " + e);
          });
        } catch (e) {
          setMsg(String(e));
        }
      })();
    </script>
  </body>
</html>
