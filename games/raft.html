<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta
			name="viewport"
			content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Unity WebGL Player | Raft</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				border: 0;
				overflow: hidden;
			}

			body {
				background: #000;
				position: fixed;
				width: 100%;
				height: 100%;
			}

			.webgl-content {
				position: absolute;
				width: 100%;
				height: 100%;
			}

			#unityContainer {
				position: absolute;
				width: 100%;
				height: 100%;
			}

			.footer {
				position: absolute;
				bottom: 0;
				width: 100%;
				text-align: center;
				padding: 10px 0;
				background: rgba(0, 0, 0, 0.5);
				z-index: 100;
			}

			.fullscreen {
				cursor: pointer;
				display: inline-block;
				width: 24px;
				height: 24px;
			}
		</style>
	</head>

	<body>
		<div class="webgl-content">
			<div
				id="loading-text"
				style="
					color: white;
					font-size: 48px;
					font-family: cursive;
					text-align: center;
					margin-top: 20px;
				"
			>
				LOADING...
			</div>
			<div id="unityContainer"></div>
		</div>

		<script>
			// -------------------------------------------------------------
			//  Raw GitHub base. jsDelivr rejects this repo (many ports in
			//  genizy/web-port exceed its total-size cap), so all assets
			//  come from raw GitHub.
			// -------------------------------------------------------------
			var REMOTE_BASE = "https://raw.githubusercontent.com/genizy/web-port/main/raft/";

			// Load UnityLoader.js as a blob so raw GitHub's text/plain
			// MIME doesn't block <script src> execution.
			function loadScriptAsBlob(url) {
				return new Promise(function (resolve, reject) {
					fetch(url)
						.then(function (r) {
							if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
							return r.text();
						})
						.then(function (text) {
							var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
							var s = document.createElement("script");
							s.src = blobUrl;
							s.onload = resolve;
							s.onerror = function () { reject(new Error("Failed to execute " + url)); };
							document.head.appendChild(s);
						})
						.catch(reject);
				});
			}

			// Fetch a JS file as text and wrap in a blob with correct MIME.
			async function fetchAsJsBlob(url) {
				var r = await fetch(url);
				if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
				var text = await r.text();
				return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
			}

			// Rewrite relative fetch/XHR to raw GitHub so mergeFiles' own
			// fetches of Build/Raft-WEBGL.*.partN land at the right place.
			var _origFetch = window.fetch;
			window.fetch = function (input, init) {
				var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
				if (url && url.indexOf('http') !== 0 && url.indexOf('blob:') !== 0 && url.indexOf('data:') !== 0) {
					url = REMOTE_BASE + url.replace(/^\.?\/+/, "");
				}
				if (input && input.url && url !== input.url) input = new Request(url, input);
				else if (typeof input === 'string') input = url;
				return _origFetch.call(this, input, init);
			};

			window.__remoteBase = REMOTE_BASE;

			loadScriptAsBlob(REMOTE_BASE + "Build/UnityLoader.js").then(function () {
				// Reinstall the downloadJob patch after UnityLoader has loaded.
				let max = 0;
				let done = 0;

				function mergeFiles(fileParts) {
					return new Promise((resolve, reject) => {
						let buffers = [];

						function fetchPart(index) {
							if (index >= fileParts.length) {
								let mergedBlob = new Blob(buffers);
								let mergedFileUrl = URL.createObjectURL(mergedBlob);
								resolve(mergedFileUrl);
								return;
							}
							fetch(fileParts[index])
								.then((response) => {
									if (!response.ok) throw new Error("HTTP " + response.status + " for " + fileParts[index]);
									return response.arrayBuffer();
								})
								.then((data) => {
									buffers.push(data);
									done = done + 1;
									var el = document.querySelector("#loading-text");
									if (el) el.textContent = `LOADING... (${done}/${max})`;
									fetchPart(index + 1);
								})
								.catch(reject);
						}
						fetchPart(0);
					});
				}

				UnityLoader.downloadJob = function (e, t) {
					var r = new XMLHttpRequest;
					if (t.parameters.url.startsWith("Build/blob")) {
						r.open("GET", t.parameters.url.replace("Build/", ""));
					} else {
						r.open("GET", t.parameters.url);
					}
					r.responseType = "arraybuffer";
					r.onload = function () {
						UnityLoader.Compression.decompress(new Uint8Array(r.response), function (e) {
							t.complete(e);
						});
					};
					t.parameters.onprogress && r.addEventListener("progress", t.parameters.onprogress);
					t.parameters.onload && r.addEventListener("load", t.parameters.onload);
					r.send();
				};

				function getParts(file, start, end) {
					let parts = [];
					for (let i = start; i <= end; i++) {
						parts.push(REMOTE_BASE + file + ".part" + i);
					}
					max = max + end;
					return parts;
				}

				function resizeUnityContainer() {
					var container = document.getElementById("unityContainer");
					container.style.width = window.innerWidth + "px";
					container.style.height = window.innerHeight + "px";
				}

				(async function () {
					try {
						// Merge the split payloads.
						const [dataUrl, asmCode] = await Promise.all([
							mergeFiles(getParts("Build/Raft-WEBGL.data.unityweb", 1, 3)),
							mergeFiles(getParts("Build/Raft-WEBGL.asm.code.unityweb", 1, 2)),
						]);

						// Resolve the asm framework and memory files too — they're
						// referenced by the JSON below and would otherwise resolve
						// relative to the page origin.
						const asmFrameworkBlobUrl = await fetchAsJsBlob(REMOTE_BASE + "Build/Raft-WEBGL.asm.framework.unityweb");
						const asmMemoryUrl = REMOTE_BASE + "Build/Raft-WEBGL.asm.memory.unityweb";

						var json = {
							"TOTAL_MEMORY": 268435456,
							"dataUrl": dataUrl,
							"asmCodeUrl": asmCode,
							"asmMemoryUrl": asmMemoryUrl,
							"asmFrameworkUrl": asmFrameworkBlobUrl,
							"splashScreenStyle": "Dark",
							"backgroundColor": "#000000"
						};
						let blob = new Blob([JSON.stringify(json)], { type: "application/json" });
						let blobUrl = URL.createObjectURL(blob);

						window.addEventListener("resize", resizeUnityContainer);

						UnityLoader.instantiate("unityContainer", json, {
							url: blobUrl,
							Module: {
								onRuntimeInitialized: function () {
									resizeUnityContainer();
									var lt = document.querySelector("#loading-text");
									if (lt) lt.remove();
								},
							},
						});
					} catch (err) {
						console.error(err);
						var lt = document.querySelector("#loading-text");
						if (lt) lt.textContent = "FAILED: " + (err && err.message ? err.message : err);
					}
				})();
			}).catch(function (err) {
				console.error(err);
				var lt = document.querySelector("#loading-text");
				if (lt) lt.textContent = "FAILED TO LOAD: " + (err && err.message ? err.message : err);
			});
		</script>
	</body>
</html>
