<!DOCTYPE html>
<!--comment-->

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>people playground.</title>
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/bubbls/ugss/main/people-playground/TemplateData/favicon.ico">
  <link rel="stylesheet" href="https://raw.githubusercontent.com/bubbls/ugss/main/people-playground/TemplateData/style.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #unity-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    #unity-canvas { width: 100% !important; height: 100% !important; display: block; background: #000; }
    #unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); z-index: 12; }
    #unity-loading-bar { display: none; }

    #xp-loader {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      background: #ece9d8;
      border: 2px solid #3a6ea5;
      box-shadow: 0 0 0 3px #ffffff inset;
      font-family: Tahoma, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    #xp-loader-title {
      background: linear-gradient(#2b74c7, #1a4a9c);
      color: white;
      padding: 4px 8px;
      font-size: 14px;
    }
    #xp-loader-bar {
      width: 100%;
      height: 18px;
      border: 1px solid #3a6ea5;
      background: white;
      overflow: hidden;
    }
    #xp-loader-fill {
      width: 0%;
      height: 100%;
      background: #4a8be0;
      transition: width 0.15s linear;
    }
  </style>
</head>
<body>
  <div id="xp-loader">
    <div id="xp-loader-title">Loading..</div>
    <div id="xp-loader-bar"><div id="xp-loader-fill"></div></div>
    <div id="xp-loader-text">0%</div>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-warning"></div>
  </div>

  <script>
    var REMOTE_BASE = "https://raw.githubusercontent.com/bubbls/ugss/main/people-playground/";

    var _origFetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
      if (url && url.indexOf('http') !== 0 && url.indexOf('blob:') !== 0 && url.indexOf('data:') !== 0) {
        url = REMOTE_BASE + url.replace(/^\.?\/+/, "");
      }
      if (input && input.url && url !== input.url) input = new Request(url, input);
      else if (typeof input === 'string') input = url;
      return _origFetch.call(this, input, init);
    };

    var _origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var u = String(url);
      if (u.indexOf('http') !== 0 && u.indexOf('blob:') !== 0 && u.indexOf('data:') !== 0) {
        url = REMOTE_BASE + u.replace(/^\.?\/+/, "");
      }
      var args = Array.prototype.slice.call(arguments);
      args[1] = url;
      return _origOpen.apply(this, args);
    };

    window.fileMergerConfig = {
      files: [
        { name: 'pggbog.data', parts: 7 },
        { name: 'pggbog.wasm', parts: 3 }
      ],
      basePath: 'Build/',
      debug: true
    };
  </script>

  <script>
    fetch("https://raw.githubusercontent.com/bubbls/UGS-Assets/main/merge.js")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (text) {
        var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
        var s = document.createElement("script");
        s.src = blobUrl;
        s.onload = function () { startGame(); };
        s.onerror = function () { document.getElementById("xp-loader-title").textContent = "Failed to execute merge.js"; };
        document.head.appendChild(s);
      })
      .catch(function (e) {
        document.getElementById("xp-loader-title").textContent = "Failed to load merge.js: " + e.message;
      });

    function loadScriptAsBlob(url) {
      return fetch(url)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (text) {
          var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = blobUrl;
            s.onload = resolve;
            s.onerror = function () { reject(new Error("Failed to execute " + url)); };
            document.head.appendChild(s);
          });
        });
    }

    function startGame() {
      var canvas = document.querySelector("#unity-canvas");
      var xpBox = document.querySelector("#xp-loader");
      var xpFill = document.querySelector("#xp-loader-fill");
      var xpText = document.querySelector("#xp-loader-text");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = REMOTE_BASE + "Build";
      var loaderUrl = buildUrl + "/pggbog.loader.js";

      var config = {
        dataUrl: buildUrl + "/pggbog.data",
        frameworkUrl: buildUrl + "/pggbog.framework.js",
        codeUrl: buildUrl + "/pggbog.wasm",
        streamingAssetsUrl: REMOTE_BASE + "StreamingAssets",
        companyName: "Studio Minus",
        productName: "People Playground",
        productVersion: "1",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      window.mergeProgress = function (p) {
        var pct = Math.round(p * 100);
        xpFill.style.width = pct + "%";
        xpText.textContent = pct + "%";
      };

      var checkReady = setInterval(function () {
        if (typeof window.mergedFileUrls !== "undefined" && window.mergedFileUrls) {
          clearInterval(checkReady);
          if (window.mergedFileUrls.data) config.dataUrl = window.mergedFileUrls.data;
          if (window.mergedFileUrls.wasm) config.codeUrl = window.mergedFileUrls.wasm;
          bootUnity();
        }
      }, 100);

      function bootUnity() {
        loadScriptAsBlob(loaderUrl).then(function () {
          return loadScriptAsBlob(config.frameworkUrl);
        }).then(function (frameworkBlobUrl) {
          config.frameworkUrl = frameworkBlobUrl;
          createUnityInstance(canvas, config, function (progress) {
            var p = Math.round(progress * 100);
            xpFill.style.width = p + "%";
            xpText.textContent = p + "%";
          }).then(function () {
            xpBox.style.display = "none";
          }).catch(function (message) {
            document.getElementById("xp-loader-title").textContent = "Error: " + message;
          });
        }).catch(function (err) {
          document.getElementById("xp-loader-title").textContent = "Error: " + err.message;
        });
      }
    }
  </script>
</body>
</html>
