<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>CrashoutCrew · portable</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }
    #unity-canvas {
      display: block; width: 100%; height: 100%;
      background: #000; outline: none;
    }
    #unity-loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 240px; height: 6px;
      background: #222; border-radius: 3px; overflow: hidden;
    }
    #unity-loading-fill {
      width: 0%; height: 100%; background: #fff;
      transition: width .15s ease-out;
    }
    #unity-error {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%; color: #fff;
      font: 14px/1.5 system-ui, sans-serif;
      white-space: pre-wrap; display: none;
    }
    #info-badge {
      position: fixed; bottom: 10px; right: 12px;
      color: #444; font-family: monospace; font-size: 11px;
      z-index: 20; pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 3px 9px; border-radius: 12px;
      border: 1px solid #222;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading"><div id="unity-loading-fill"></div></div>
  <div id="unity-error"></div>
  <div id="info-badge">CrashoutCrew · portable</div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var fill = document.querySelector("#unity-loading-fill");
    var errorBox = document.querySelector("#unity-error");

    // -------------------------------------------------------------
    //  Two bases, for two different jobs:
    //
    //  GAME_BASE
    //    contains index.html / Build / split-loader.js
    //    = ".../CrashoutCrew-WebGL/WebGL/"
    //    Used for: Build.loader.js, WebGL.loader.js, WebGL.data,
    //              WebGL.wasm, WebGL.framework.js, StreamingAssets
    //
    //  MANIFEST_BASE
    //    contains split_manifest.json (and, per the manifest's own
    //    "original" fields, also the WebGL/ subdirectory)
    //    = ".../CrashoutCrew-WebGL/"
    //    Used for: split_manifest.json, and by the split-loader when
    //              it resolves entry.original ("WebGL/Build/WebGL.data")
    //              to preload URLs.
    //
    //  Because entry.original starts with "WebGL/", the preloaded blob
    //  is registered under the pathname
    //    /gh/larpinguser/dotripports@main/CrashoutCrew-WebGL/WebGL/Build/WebGL.data
    //  which is exactly the pathname Unity requests when it asks for
    //  config.dataUrl = GAME_BASE + "Build/WebGL.data".
    //  → p === key, so the fetch interceptor matches without relying
    //    on the endsWith fallback.
    // -------------------------------------------------------------
    var REPO_BASE     = "https://cdn.jsdelivr.net/gh/larpinguser/dotripports@main/";
    var GAME_BASE     = REPO_BASE + "CrashoutCrew-WebGL/WebGL/";
    var MANIFEST_BASE = REPO_BASE + "CrashoutCrew-WebGL/";

    // split-loader.js reads this on load. Set BEFORE injecting it.
    window.splitRoot = MANIFEST_BASE;

    // Handy for debugging size mismatches during preload.
    // window.splitDebug = true;

    var config = {
      dataUrl: GAME_BASE + "Build/WebGL.data",
      frameworkUrl: GAME_BASE + "Build/WebGL.framework.js",
      codeUrl: GAME_BASE + "Build/WebGL.wasm",
      streamingAssetsUrl: GAME_BASE + "StreamingAssets",
      companyName: "Aggro Crab",
      productName: "CrashoutCrew",
      productVersion: "1.1.9",
      showBanner: function (msg, type) {
        if (type === "error") {
          errorBox.style.display = "block";
          errorBox.textContent = msg;
        }
      }
    };

    function startGame() {
      var script = document.createElement("script");
      script.src = GAME_BASE + "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          loading.style.display = "none";
          errorBox.style.display = "block";
          errorBox.textContent = message;
        });
      };
      script.onerror = function () {
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = "Failed to load " + GAME_BASE + "Build/WebGL.loader.js";
      };
      document.body.appendChild(script);
    }

    var splitScript = document.createElement("script");
    splitScript.src = GAME_BASE + "split-loader.js";
    splitScript.onload = function () {
      if (!window.splitLoader) {
        errorBox.style.display = "block";
        errorBox.textContent = "split-loader.js did not define window.splitLoader.";
        return;
      }
      window.splitLoader.preload(function (loaded, total) {
        fill.style.width = (100 * loaded / total) + "%";
      }).then(startGame).catch(function (err) {
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = "Failed to load game data parts: " + (err && err.message ? err.message : err);
      });
    };
    splitScript.onerror = function () {
      errorBox.style.display = "block";
      errorBox.textContent = "Could not load " + GAME_BASE + "split-loader.js";
    };
    document.body.appendChild(splitScript);
  </script>
</body>
</html>
