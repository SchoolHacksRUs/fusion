<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>CrashoutCrew · portable</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }
    #unity-canvas {
      display: block; width: 100%; height: 100%;
      background: #000; outline: none;
    }
    #unity-loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      text-align: center;
    }
    #unity-loading-bar {
      width: 100%; height: 6px;
      background: #222; border-radius: 3px; overflow: hidden;
    }
    #unity-loading-fill {
      width: 0%; height: 100%; background: #fff;
      transition: width .15s ease-out;
    }
    #unity-loading-label {
      margin-top: 10px;
      color: #aaa;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.3px;
      min-height: 1.3em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #unity-error {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%; color: #fff;
      font: 14px/1.5 system-ui, sans-serif;
      white-space: pre-wrap; display: none;
    }
    #info-badge {
      position: fixed; bottom: 10px; right: 12px;
      color: #444; font-family: monospace; font-size: 11px;
      z-index: 20; pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 3px 9px; border-radius: 12px;
      border: 1px solid #222;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading">
    <div id="unity-loading-bar"><div id="unity-loading-fill"></div></div>
    <div id="unity-loading-label">initializing…</div>
  </div>
  <div id="unity-error"></div>
  <div id="info-badge">CrashoutCrew · portable</div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var fill = document.querySelector("#unity-loading-fill");
    var label = document.querySelector("#unity-loading-label");
    var errorBox = document.querySelector("#unity-error");

    function setLabel(text) {
      label.textContent = text;
    }

    // -------------------------------------------------------------
    //  Raw GitHub bases.
    // -------------------------------------------------------------
    var REPO_BASE     = "https://raw.githubusercontent.com/larpinguser/dotripports/main/";
    var GAME_BASE     = REPO_BASE + "CrashoutCrew-WebGL/WebGL/";
    var MANIFEST_BASE = REPO_BASE + "CrashoutCrew-WebGL/";

    window.splitRoot = MANIFEST_BASE;

    async function loadScriptAsBlob(url, labelText) {
      setLabel("loading " + (labelText || url.split("/").pop()));
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
      var text = await res.text();
      var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
      await new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = blobUrl;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("Failed to execute " + url)); };
        document.head.appendChild(s);
      });
    }

    async function loadFrameworkAsBlob(url) {
      setLabel("loading WebGL.framework.js");
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
      var text = await res.text();
      return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
    }

    var config = {
      dataUrl: GAME_BASE + "Build/WebGL.data",
      frameworkUrl: null,
      codeUrl: GAME_BASE + "Build/WebGL.wasm",
      streamingAssetsUrl: GAME_BASE + "StreamingAssets",
      companyName: "Aggro Crab",
      productName: "CrashoutCrew",
      productVersion: "1.1.9",
      showBanner: function (msg, type) {
        if (type === "error") {
          errorBox.style.display = "block";
          errorBox.textContent = msg;
        }
      }
    };

    async function startGame() {
      try {
        config.frameworkUrl = await loadFrameworkAsBlob(GAME_BASE + "Build/WebGL.framework.js");

        await loadScriptAsBlob(GAME_BASE + "Build/WebGL.loader.js", "WebGL.loader.js");

        setLabel("starting engine…");
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
          setLabel("starting engine… " + Math.round(progress * 100) + "%");
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          loading.style.display = "none";
          errorBox.style.display = "block";
          errorBox.textContent = message;
        });
      } catch (err) {
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = err && err.message ? err.message : String(err);
      }
    }

    (async function () {
      try {
        await loadScriptAsBlob(GAME_BASE + "split-loader.js", "split-loader.js");

        if (!window.splitLoader) {
          errorBox.style.display = "block";
          errorBox.textContent = "split-loader.js did not define window.splitLoader.";
          return;
        }

        setLabel("preloading game data…");
        window.splitLoader.preload(function (loaded, total) {
          fill.style.width = (100 * loaded / total) + "%";
          setLabel("preloading game data… " + loaded + " / " + total);
        }).then(startGame).catch(function (err) {
          loading.style.display = "none";
          errorBox.style.display = "block";
          errorBox.textContent = "Failed to load game data parts: " + (err && err.message ? err.message : err);
        });
      } catch (err) {
        errorBox.style.display = "block";
        errorBox.textContent = "Could not load split-loader.js: " + (err && err.message ? err.message : err);
      }
    })();
  </script>
</body>
</html>
