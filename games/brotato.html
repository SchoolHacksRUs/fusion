<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Brotato</title>

<style>
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
#canvas { display: block; width: 100vw !important; height: 100vh !important; position: fixed; top: 0; left: 0; border: none; outline: none; object-fit: fill; }

#status {
    position: absolute;
    top: 30px;
    left: 0;
    width: 100%;
    z-index: 10;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    background: linear-gradient(to right, #500, #550, #050, #055, #005, #505, #500);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: rainbow 3s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
}

@keyframes rainbow { to { background-position: 200% center; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">LOADING: 0.00 / 163.00 MB</div>

<script>
(function() {
'use strict';

// -------------------------------------------------------------
//  Raw GitHub base. jsDelivr rejects this repo, so all assets
//  come from raw GitHub.
// -------------------------------------------------------------
const HASH = "49e46a50c1dbf11f78c7c9ee2659218d534ace63";
const BASE = "https://raw.githubusercontent.com/shayderrr/newports/" + HASH + "/";
const TOTAL_MB = "163.00";

const originalFetch = window.fetch;
const mergedData = {};
const pendingRequests = {};
let bytesLoadedSoFar = 0;

const statusEl = document.getElementById('status');

function updateStatus(currentBytes) {
    const currentMB = (currentBytes / 1048576).toFixed(2);
    statusEl.textContent = "LOADING: " + currentMB + " / " + TOTAL_MB + " MB";
}

// Intercept fetch so any request for index.pck or index.wasm is served
// from our merged in-memory blobs instead of hitting the network.
window.fetch = function(url, ...args) {
    const u = url.toString();
    if (u.includes("index.pck") || u.includes("index.wasm")) {
        const f = u.includes(".pck") ? "index.pck" : "index.wasm";
        if (mergedData[f]) return Promise.resolve(new Response(mergedData[f]));
        return new Promise((resolve) => {
            if (!pendingRequests[f]) pendingRequests[f] = [];
            pendingRequests[f].push(resolve);
        });
    }
    return originalFetch(url, ...args);
};

// Fetch each split part and merge into one Blob with an explicit MIME
// type. The MIME hint is critical: without it, WebAssembly.instantiateStreaming
// rejects the blob and Godot stalls silently.
async function merge(name, start, end, mimeType) {
    const bufs = [];
    for (let i = start; i <= end; i++) {
        const url = BASE + encodeURIComponent(name + ".part" + i);
        const r = await originalFetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
        const data = await r.arrayBuffer();
        bufs.push(data);
        bytesLoadedSoFar += data.byteLength;
        updateStatus(bytesLoadedSoFar);
    }
    const b = new Blob(bufs, { type: mimeType });
    mergedData[name] = b;
    if (pendingRequests[name]) {
        pendingRequests[name].forEach(function (res) { res(new Response(b)); });
        delete pendingRequests[name];
    }
}

// Fetch a JS file as text and wrap it in a blob with correct MIME.
// Raw GitHub serves .js as text/plain, which blocks <script src>.
function loadScriptAsBlob(url) {
    return new Promise(function (resolve, reject) {
        originalFetch(url)
            .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
                return r.text();
            })
            .then(function (text) {
                var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
                var s = document.createElement("script");
                s.src = blobUrl;
                s.onload = resolve;
                s.onerror = function () { reject(new Error("Failed to execute " + url)); };
                document.head.appendChild(s);
            })
            .catch(reject);
    });
}

async function init() {
    try {
        // Merge the split payloads with explicit MIME types.
        await merge("index.pck", 1, 8, "application/octet-stream");
        await merge("index.wasm", 1, 2, "application/wasm");

        // Load the engine loader as a blob, then boot.
        await loadScriptAsBlob(BASE + "index.js");

        const engine = new Engine({
            "args": [],
            "canvasResizePolicy": 2,
            "executable": "index",
            "fileSizes": { "index.pck": 144746880, "index.wasm": 26156492 },
            "focusCanvas": true
        });

        engine.startGame({
            onProgress: function (current, total) {
                if (total > 0) updateStatus(bytesLoadedSoFar);
            }
        }).then(function () {
            statusEl.style.display = 'none';
            window.dispatchEvent(new Event('resize'));
        }, function (err) {
            console.error(err);
            statusEl.textContent = "LOAD ERROR: " + (err && err.message ? err.message : err);
        });
    } catch (e) {
        console.error(e);
        statusEl.textContent = "LOAD ERROR: " + (e && e.message ? e.message : e);
    }
}
init();
})();
</script>
</body>
</html>
