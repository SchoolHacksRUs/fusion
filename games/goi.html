<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Getting Over It</title>
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/genizy/web-port/main/getting-over-it/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/genizy/web-port/main/getting-over-it/TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            border: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>
    <script>
        // -------------------------------------------------------------
        //  Raw GitHub base. jsDelivr rejects this repo (many ports in
        //  the genizy/web-port repo exceed its total-size cap).
        // -------------------------------------------------------------
        var REMOTE_BASE = "https://raw.githubusercontent.com/genizy/web-port/main/getting-over-it/";
        var buildUrl = REMOTE_BASE + "Build";

        const loadingText = document.querySelector("#loading-text");
        let totalBytes = 0;
        let loadedBytes = 0;

        function formatSize(bytes) {
            if (bytes > 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
            } else if (bytes > 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(2) + " MB";
            } else if (bytes > 1024) {
                return (bytes / 1024).toFixed(2) + " KB";
            } else {
                return bytes + " B";
            }
        }

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                const doneText = formatSize(loadedBytes);
                const totalText = formatSize(totalBytes);
                const percent = totalBytes > 0 ? ((loadedBytes / totalBytes) * 100).toFixed(1) : "?";
                loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        // Merge split parts into a Blob with an explicit MIME type so
        // WebAssembly.instantiateStreaming accepts the wasm blob URL.
        async function mergeFiles(parts, mimeType) {
            const buffers = await Promise.all(parts.map(fetchWithProgress));
            return URL.createObjectURL(new Blob(buffers, { type: mimeType }));
        }

        function getParts(file, count) {
            let parts = [];
            for (let i = 1; i <= count; i++) {
                parts.push(buildUrl + "/" + file + ".part" + i);
            }
            return parts;
        }

        // Fetch a remote JS file as text and wrap it in a blob with
        // application/javascript MIME. Raw GitHub serves .js as
        // text/plain, which browsers refuse to execute as <script src>
        // and Unity refuses to use as a framework URL.
        async function fetchAsJsBlob(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
            const text = await res.text();
            return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
        }

        (async () => {
            try {
                const dataParts = getParts("GettingOverIt.data", 32);
                const wasmParts = getParts("GettingOverIt.wasm", 2);
                totalBytes = 691732588;

                const [dataUrl, wasmUrl] = await Promise.all([
                    mergeFiles(dataParts, "application/octet-stream"),
                    mergeFiles(wasmParts, "application/wasm")
                ]);

                var container = document.querySelector("#unity-container");
                var canvas = document.querySelector("#unity-canvas");
                var loadingBar = document.querySelector("#unity-loading-bar");
                var progressBarFull = document.querySelector("#unity-progress-bar-full");

                function unityShowBanner(msg, type) {
                    console.warn("[unity " + (type || "info") + "]", msg);
                }

                var loaderUrl = buildUrl + "/GettingOverIt.loader.js";

                // Framework loaded as blob so raw GitHub's text/plain MIME
                // doesn't block it.
                const frameworkBlobUrl = await fetchAsJsBlob(buildUrl + "/GettingOverIt.framework.js");

                var config = {
                    dataUrl: dataUrl,
                    frameworkUrl: frameworkBlobUrl,
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: REMOTE_BASE + "StreamingAssets",
                    companyName: "Bennett Foddy",
                    productName: "Getting Over It",
                    productVersion: "1.7",
                    showBanner: unityShowBanner,
                };

                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    var meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                    document.getElementsByTagName('head')[0].appendChild(meta);
                    container.className = "unity-mobile";
                    canvas.className = "unity-mobile";
                } else {
                    function resizeCanvas() {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        canvas.style.width = window.innerWidth + "px";
                        canvas.style.height = window.innerHeight + "px";
                    }
                    window.addEventListener("resize", resizeCanvas);
                    resizeCanvas();
                }

                loadingBar.style.display = "block";

                // Load loader script as a blob so raw GitHub's text/plain
                // MIME doesn't block execution.
                const loaderBlobUrl = await fetchAsJsBlob(loaderUrl);
                await new Promise((resolve, reject) => {
                    var script = document.createElement("script");
                    script.src = loaderBlobUrl;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error("Failed to load " + loaderUrl));
                    document.body.appendChild(script);
                });

                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((unityInstance) => {
                    loadingBar.style.display = "none";
                    if (loadingText.parentNode) loadingText.remove();
                }).catch((message) => {
                    console.error(message);
                    loadingText.textContent = "FAILED: " + message;
                });
            } catch (err) {
                console.error(err);
                loadingText.textContent = "FAILED: " + (err && err.message ? err.message : err);
            }
        })();
    </script>
</body>

</html>
