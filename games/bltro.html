<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro</title>

  <link rel="stylesheet" type="text/css" href="https://raw.githubusercontent.com/thirstygithub/mathamatic-notes/master/theme/love.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Both canvases occupy the full viewport, stacked.
       The loading canvas sits on top until the game is ready. */
    #loadingCanvas,
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      border: none;
      outline: none;
    }

    #loadingCanvas {
      z-index: 1;
    }

    #canvas {
      z-index: 0;
    }
  </style>

  <script>
    if (typeof console !== 'undefined' && typeof console.debug !== 'function') {
      console.debug = console.log.bind(console);
    }
    if (typeof window !== 'undefined') {
      if (typeof window.__getWebDB !== 'function') {
        window.__getWebDB = function(name) {
          try { return window.localStorage ? window.localStorage.getItem(name) : null; }
          catch (err) { return null; }
        };
      }
      if (typeof window.__setWebDB !== 'function') {
        window.__setWebDB = function(name, value) {
          try { if (window.localStorage) { window.localStorage.setItem(name, value); return true; } }
          catch (err) {}
          return false;
        };
      }
    }
  </script>
</head>

<body>
  <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var REMOTE_BASE = "https://raw.githubusercontent.com/thirstygithub/mathamatic-notes/master/";

    // Rewrite relative fetch/XHR URLs to the remote base.
    var origFetch = window.fetch ? window.fetch.bind(window) : null;
    if (origFetch) {
      window.fetch = function (input, init) {
        var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
        if (url && url.indexOf(REMOTE_BASE) !== 0 && !/^(https?:|blob:|data:)/i.test(url)) {
          url = REMOTE_BASE + url.replace(/^\.?\/+/, "").replace(/^\/+/, "");
        }
        if (input && input.url && url !== input.url) {
          input = new Request(url, input);
        } else if (typeof input === "string") {
          input = url;
        }
        return origFetch.call(this, input, init);
      };
    }

    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var u = String(url);
      if (u.indexOf(REMOTE_BASE) !== 0 && !/^(https?:|blob:|data:)/i.test(u)) {
        url = REMOTE_BASE + u.replace(/^\.?\/+/, "").replace(/^\/+/, "");
      }
      var args = Array.prototype.slice.call(arguments);
      args[1] = url;
      return origOpen.apply(this, args);
    };

    console.info('Fetch/XHR interceptors installed. REMOTE_BASE=' + REMOTE_BASE);

    (function () {
      fetch(REMOTE_BASE + "consolewrapper.js")
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (text) {
          console.info('consolewrapper.js fetched (' + text.length + ' bytes), injecting as blob');
          var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
          var s = document.createElement("script");
          s.src = blobUrl;
          document.head.appendChild(s);
        })
        .catch(function (e) {
          console.warn("consolewrapper.js failed: " + e.message);
        });
    })();
  </script>

  <script>
    window.callad = () => {
      window.parent.postMessage({ type: 'adcall' }, '*');
    };

    // Size a canvas so its backing store matches the CSS size * devicePixelRatio,
    // keeping rendering crisp on HiDPI screens.
    function fitCanvas(canvas) {
      var dpr = window.devicePixelRatio || 1;
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }

    var loadingCanvas = document.getElementById('loadingCanvas');
    var gameCanvas = document.getElementById('canvas');
    fitCanvas(loadingCanvas);
    fitCanvas(gameCanvas);

    window.addEventListener('resize', function () {
      fitCanvas(loadingCanvas);
      fitCanvas(gameCanvas);
    });

    function goFullScreen() {
      if (gameCanvas.requestFullScreen) gameCanvas.requestFullScreen();
      else if (gameCanvas.webkitRequestFullScreen) gameCanvas.webkitRequestFullScreen();
      else if (gameCanvas.mozRequestFullScreen) gameCanvas.mozRequestFullScreen();
    }

    var loadingContext = loadingCanvas.getContext('2d');

    function drawLoadingText(text) {
      var w = loadingCanvas.width;
      var h = loadingCanvas.height;
      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(0, 0, w, h);
      loadingContext.font = '2em arial';
      loadingContext.textAlign = 'center';
      loadingContext.textBaseline = 'middle';
      loadingContext.fillStyle = "rgb(11, 86, 117)";
      loadingContext.fillText(text, w / 2, h / 2);
    }

    window.onload = function () { window.focus(); };
    window.onclick = function () { window.focus(); };

    window.addEventListener("keydown", function (e) {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
    }, false);

    var Module = {
      // Emscripten preloads the game's files into its virtual filesystem.
      // LÖVE reads from the VFS, so this stays as "./data".
      arguments: ["./data"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: (function () {
        gameCanvas.addEventListener("webglcontextlost", function (e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);
        return gameCanvas;
      })(),
      setStatus: function (text) {
        if (text) {
          // Suppress the noisy "Preparing... (N/569)" spam — only log milestones.
          if (!/^Preparing\.\.\. \(\d+\/\d+\)$/.test(text) &&
              !/^Preloading assets\.\.\. \(\d+\/\d+\)$/.test(text)) {
            console.info('Module.setStatus: ' + text);
          }
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          console.info('Module.setStatus: done. Hiding loading canvas.');
          loadingCanvas.style.display = 'none';
          gameCanvas.style.zIndex = '2';
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function (event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function (text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    var applicationLoad = function (e) {
      console.info('applicationLoad called — Love(Module) starting');
      try {
        Love(Module);
      } catch (err) {
        console.error('Love() threw: ' + (err && err.message ? err.message : err));
      }
    };
  </script>

  <script>
    (function loadAsBlob(name, onload) {
      console.info('Loading ' + name + ' as blob...');
      fetch(REMOTE_BASE + name)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status + " for " + name);
          return r.text();
        })
        .then(function (text) {
          console.info(name + ' fetched (' + text.length + ' bytes). Injecting...');
          var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
          var s = document.createElement("script");
          s.src = blobUrl;
          s.onload = function () {
            console.info(name + ' executed.');
            if (onload) onload();
          };
          s.onerror = function () {
            console.error(name + ' failed to execute.');
          };
          document.body.appendChild(s);
        })
        .catch(function (e) {
          console.error(name + ' failed: ' + e.message);
        });
    })("game.js", function () {
      (function () {
        console.info('Loading love.js as blob...');
        fetch(REMOTE_BASE + "love.js")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status + " for love.js");
            return r.text();
          })
          .then(function (text) {
            console.info('love.js fetched (' + text.length + ' bytes). Injecting...');
            var blobUrl = URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
            var s = document.createElement("script");
            s.src = blobUrl;
            s.onload = function () {
              console.info('love.js executed. Calling applicationLoad...');
              applicationLoad(s);
            };
            s.onerror = function () {
              console.error('love.js failed to execute.');
            };
            document.body.appendChild(s);
          })
          .catch(function (e) {
            console.error("love.js failed: " + e.message);
          });
      })();
    });
  </script>
</body>

</html>
