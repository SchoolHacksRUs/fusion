<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity WebGL Player | boil Noodles at Night</title>
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/SomeRandomFella/portsandrips/master/boilnoodles/TemplateData/favicon.ico" />
    <link rel="stylesheet" href="https://raw.githubusercontent.com/SomeRandomFella/portsandrips/master/boilnoodles/TemplateData/style.css" />
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">boil Noodles at Night</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Raw GitHub base. jsDelivr's repo-total-size cap rejects this repo
      // (portsandrips contains many ports). Raw GitHub has no such cap.
      var REMOTE_BASE = "https://raw.githubusercontent.com/SomeRandomFella/portsandrips/master/boilnoodles/";
      var buildUrl = REMOTE_BASE + "Build";

      // Fetch a remote JS file as text and wrap in a blob with correct MIME.
      // Raw GitHub serves .js as text/plain, which browsers refuse to execute
      // as <script src> and which Unity refuses to use as a framework URL.
      async function fetchAsJsBlob(url) {
        var r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
        var text = await r.text();
        return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
      }

      // Fetch a remote binary file as a Blob with the given MIME type.
      async function fetchAsBlob(url, mimeType) {
        var r = await fetch(url);
        if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
        var buf = await r.arrayBuffer();
        return URL.createObjectURL(new Blob([buf], { type: mimeType }));
      }

      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";

      // Start with no URLs — they're resolved asynchronously below.
      var config = {
        frameworkUrl: null,
        dataUrl: null,
        codeUrl: null,
        streamingAssetsUrl: REMOTE_BASE + "StreamingAssets",
        companyName: "arydk",
        productName: "boil Noodles at Night",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner("WebGL builds are not supported on mobile devices.");
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      // Merge the split wasm parts into a single Blob with application/wasm
      // so WebAssembly.instantiateStreaming accepts the blob URL.
      function fetchAndMergeWasm() {
        return Promise.all([
          fetch(buildUrl + "/WebGLBuild.wasm.part001").then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status + " for wasm.part001");
            return r.arrayBuffer();
          }),
          fetch(buildUrl + "/WebGLBuild.wasm.part002").then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status + " for wasm.part002");
            return r.arrayBuffer();
          }),
        ]).then(function (buffers) {
          var total = buffers.reduce(function (s, b) {
            return s + b.byteLength;
          }, 0);
          var merged = new Uint8Array(total);
          var offset = 0;
          buffers.forEach(function (b) {
            merged.set(new Uint8Array(b), offset);
            offset += b.byteLength;
          });
          return URL.createObjectURL(new Blob([merged], { type: "application/wasm" }));
        });
      }

      (async function () {
        try {
          // 1) Fetch the loader as a blob and inject it so it executes.
          var loaderBlobUrl = await fetchAsJsBlob(loaderUrl);
          await new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = loaderBlobUrl;
            s.onload = resolve;
            s.onerror = function () { reject(new Error("Failed to execute loader")); };
            document.head.appendChild(s);
          });

          // 2) Fetch and blob-wrap the framework so Unity accepts it.
          config.frameworkUrl = await fetchAsJsBlob(buildUrl + "/WebGLBuild.framework.js");

          // 3) Fetch and blob-wrap the data file with explicit MIME.
          config.dataUrl = await fetchAsBlob(buildUrl + "/WebGLBuild.data", "application/octet-stream");

          // 4) Fetch, merge, and blob-wrap the split wasm parts.
          config.codeUrl = await fetchAndMergeWasm();

          // 5) Boot.
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then(function (unityInstance) {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = function () {
                unityInstance.SetFullscreen(1);
              };
            })
            .catch(function (message) {
              alert(message);
            });

        } catch (err) {
          alert("Load failed: " + (err && err.message ? err.message : err));
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
