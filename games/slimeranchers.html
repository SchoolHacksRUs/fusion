<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://raw.githubusercontent.com/web-ports/slime-ranchers/f0c5856ac43cf0cfbab4c58139282fc75f9b1861/">
    <meta charset="utf-8">
    <title>Slime Rancher Decompiled v0.2.1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.0/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        .webgl-content {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
        }
        #gameContainer canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div class="webgl-content">
        <div class="bg">
            <img class="bg" src="TemplateData/loading_bg.png" style="width: 100%; height: 100%; padding: 0px; margin: 0px; border: 0px; position: absolute;">
        </div>
        <div id="loading-text" style="-webkit-text-stroke-width: 2px; -webkit-text-stroke-color: black; color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
        <div id="gameContainer" style="width: 960px; height: 600px"></div>
    </div>
</body>

<script>
    var REMOTE_BASE = "https://raw.githubusercontent.com/web-ports/slime-ranchers/f0c5856ac43cf0cfbab4c58139282fc75f9b1861/";

    // ------------------------------------------------------------------
    // Manual script injection for sandboxed editors (w3schools TryIt,
    // CodePen, etc.) that strip external <script src="..."> tags.
    // ------------------------------------------------------------------
    function injectScript(name) {
        return new Promise(function (resolve, reject) {
            var fullUrl = REMOTE_BASE + name;
            fetch(fullUrl)
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + name);
                    return r.text();
                })
                .then(function (text) {
                    var blobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
                    var s = document.createElement('script');
                    s.src = blobUrl;
                    s.onload = function () { resolve(); };
                    s.onerror = function () { reject(new Error(name + ' failed to execute.')); };
                    document.body.appendChild(s);
                })
                .catch(reject);
        });
    }

    async function ensureRuntime() {
        if (typeof UnityLoader !== 'undefined') return;
        await injectScript('TemplateData/UnityProgress.js');
        await injectScript('Build/UnityLoader.js');
        await injectScript('mobile-controls.js');
        await injectScript('TemplateData/responsive.js');
        if (typeof UnityLoader === 'undefined') {
            throw new Error('UnityLoader still undefined after injection.');
        }
    }

    // ------------------------------------------------------------------
    // Blob-XHR wrapper: keeps UnityLoader happy when it tries to fetch
    // the game's data blob through XHR.
    // ------------------------------------------------------------------
    const ogxhr = window.XMLHttpRequest;
    function xhrfunc() {
        const xhr = new ogxhr();
        const open = xhr.open;
        xhr.open = function(method, url, ...rest) {
            if (url.includes("blob:")) {
                return open.call(this, method, "blob:" + url.split("blob:")[1], ...rest);
            }
            return open.call(this, method, url, ...rest);
        };
        return xhr;
    }
    window.XMLHttpRequest = xhrfunc;

    var loadingText = document.querySelector("#loading-text");
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + url);

        if (!response.body) {
            var buf = await response.arrayBuffer();
            loadedBytes += buf.byteLength;
            if (loadingText) {
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                loadingText.innerHTML = `LOADING... ${mbDone} MB / 54.5 MB`;
            }
            return buf;
        }

        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            received += value.length;
            loadedBytes += value.length;
            chunks.push(value);
            let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            if (loadingText) {
                loadingText.innerHTML = `LOADING... ${mbDone} MB / 54.5 MB`;
            }
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
        }
        return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts) {
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
            parts.push(file + ".part" + i);
        }
        return parts;
    }

    function resizeUnityContainer() {
        var container = document.getElementById("gameContainer");
        if (!container) return;
        var canvas = container.querySelector("canvas");
        container.style.width = window.innerWidth + "px";
        container.style.height = window.innerHeight + "px";
        if (canvas) {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }
    }

    (async () => {
        try {
            await ensureRuntime();

            const parts = getParts("Build/slimeBUILDS.data.unityweb", 1, 3);
            const [dataUrl] = await Promise.all([
                mergeFiles(parts),
            ]);

            const json = {
                "companyName": "Snubs",
                "productName": "Slime Rancher Prototype",
                "dataUrl": dataUrl,
                "wasmCodeUrl": "slimeBUILDS.wasm.code.unityweb",
                "wasmFrameworkUrl": "slimeBUILDS.framework.unityweb",
                "TOTAL_MEMORY": 536870912,
                "graphicsAPI": ["WebGL 2.0", "WebGL 1.0"],
                "webglContextAttributes": {
                    "preserveDrawingBuffer": false
                },
                "splashScreenStyle": "Dark"
            };

            let blob = new Blob([JSON.stringify(json)], { type: "application/json" });
            let blobUrl = URL.createObjectURL(blob);
            window.addEventListener("resize", resizeUnityContainer);

            UnityLoader.instantiate("gameContainer", json, {
                url: blobUrl,
                Module: {
                    onRuntimeInitialized: function() {
                        resizeUnityContainer();
                        var lt = document.querySelector("#loading-text");
                        if (lt) lt.remove();
                    },
                },
            });
        } catch (err) {
            console.error('BOOT FAILED: ' + (err && err.message ? err.message : err));
            var lt = document.querySelector("#loading-text");
            if (lt) lt.innerHTML = 'ERROR: ' + (err && err.message ? err.message : err);
        }
    })();
</script>

</html>
