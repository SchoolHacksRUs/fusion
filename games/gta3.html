<!doctype html>
<html lang="en">
<head>
<base href="https://raw.githubusercontent.com/SchoolHacksRUs/gta-3/main/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA III</title>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas.emscripten {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: auto;
  }
  #loading {
    color: #fff;
    font: 14px monospace;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    width: 80%;
    max-width: 500px;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* Top loading bar — slides up and fades out once all chunks are merged. */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 10, 0.9);
    color: #8ec3e3;
    font: 12px monospace;
    padding: 6px 10px;
    z-index: 100001;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #8ec3e3;
    transition: opacity 0.5s, transform 0.5s;
  }
  #topbar.hidden {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }
  #topbar progress {
    flex: 1;
    height: 12px;
  }
  #topbar .label {
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="topbar">
  <span class="label" id="topbar-label">Loading…</span>
  <progress id="topbar-progress" value="0" max="100"></progress>
  <span class="label" id="topbar-count"></span>
</div>

<div id="loading">Loading GTA III...</div>

<script>
  window.addEventListener('unhandledrejection', function(e) {
    if (e.reason && e.reason.name && e.reason.name.indexOf('DocumentError') !== -1) {
      e.preventDefault();
      return;
    }
    document.getElementById('loading').textContent = 'ERR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
  (function() {
    var _rpl = Element.prototype.requestPointerLock;
    if (_rpl) Element.prototype.requestPointerLock = function() {
      try { var p = _rpl.call(this); if (p && p.catch) p.catch(function(){}); return p; }
      catch(e) {}
    };
  })();
</script>

<script>
  // ------------------------------------------------------------------
  // Top progress bar controller.
  //   - During chunk merge: driven by bytes received (0 → 39 chunks).
  //   - The bar hides the moment the last chunk is merged.
  // ------------------------------------------------------------------
  window.__setBar = function (label, value, max, count) {
    var l = document.getElementById('topbar-label');
    var p = document.getElementById('topbar-progress');
    var c = document.getElementById('topbar-count');
    if (l) l.textContent = label;
    if (p) { p.value = value || 0; p.max = max || 100; }
    if (c) c.textContent = count || '';
  };

  window.__hideBar = function () {
    var bar = document.getElementById('topbar');
    if (bar) bar.classList.add('hidden');
    var loading = document.getElementById('loading');
    if (loading) loading.classList.add('hidden');
  };
</script>

<script>
  // ------------------------------------------------------------------
  // re3.data interceptor. Drives the top bar from the chunk loop and
  // hides the bar as soon as all 39 chunks have been merged.
  // ------------------------------------------------------------------
  (function() {
    var ORIG_FETCH = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && /re3\.data(\?|$)/i.test(url) && !/\.(chunk|part)/.test(url)) {
        return loadDataParts();
      }
      return ORIG_FETCH.call(this, url, opts);
    };
    async function loadDataParts() {
      window.__setBar('Fetching chunks…', 0, 100, '');
      var parts = [];
      for (var i = 0; ; i++) {
        var resp = await ORIG_FETCH.call(window, 're3.chunk.' + i);
        if (!resp.ok) break;
        var ab = await resp.arrayBuffer();
        parts.push(ab);
        var totalSoFar = parts.reduce(function(s, p) { return s + p.byteLength; }, 0);
        window.__setBar(
          'Fetching chunks…',
          Math.min(100, Math.round((i + 1) / 39 * 100)),
          100,
          '(' + (i + 1) + '/39 · ' + (totalSoFar / (1024 * 1024)).toFixed(1) + ' MB)'
        );
      }
      var total = parts.reduce(function(s, p) { return s + p.byteLength; }, 0);
      var combined = new Uint8Array(total);
      var offset = 0;
      for (var pi = 0; pi < parts.length; pi++) {
        combined.set(new Uint8Array(parts[pi]), offset);
        offset += parts[pi].byteLength;
      }

      // All chunks are merged. Hide the loading bar now — the engine
      // has everything it needs and will take over from here.
      window.__hideBar();

      return new Response(combined, {
        status: 200,
        headers: { 'Content-Type': 'application/octet-stream' }
      });
    }
    var origGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attrs) {
      if (type.indexOf('webgl') === 0 || type.indexOf('experimental-webgl') === 0) {
        attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
      }
      return origGetContext.call(this, type, attrs);
    };
  })();

  Element.prototype.requestFullscreen =
  Element.prototype.webkitRequestFullscreen = function() {
    return Promise.reject(new DOMException("blocked"));
  };
  document.exitFullscreen =
  document.webkitExitFullscreen = function() {};
  Object.defineProperty(document, 'fullscreenElement', { get: function() { return null; } });
  Object.defineProperty(document, 'webkitFullscreenElement', { get: function() { return null; } });
  Object.defineProperty(document, 'fullscreenEnabled', { get: function() { return false; } });
  Object.defineProperty(document, 'webkitFullscreenEnabled', { get: function() { return false; } });

  (function() {
    var RealAC = window.AudioContext || window.webkitAudioContext;
    if (!RealAC) return;
    var contexts = [];
    function resumeAll() {
      for (var i = 0; i < contexts.length; i++) {
        var ctx = contexts[i];
        if (ctx.state === 'suspended') ctx.resume();
      }
    }
    document.addEventListener('click', resumeAll);
    document.addEventListener('touchstart', resumeAll);
    document.addEventListener('keydown', resumeAll);
    var Wrapper = function(options) {
      var ctx = new RealAC(options);
      contexts.push(ctx);
      if (ctx.state === 'suspended') ctx.resume().catch(function(){});
      return ctx;
    };
    Wrapper.prototype = RealAC.prototype;
    window.AudioContext = Wrapper;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapper;
  })();
</script>

<script>
  var Module = {
    preRun: [],
    postRun: [],
    canvas: (function() {
      var canvas = document.getElementById('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'canvas';
        canvas.className = 'emscripten';
        document.body.appendChild(canvas);
      }
      return canvas;
    })(),
    setStatus: function(text) {
      var loading = document.getElementById('loading');
      if (loading) loading.textContent = text;
    },
    totalDependencies: 0,
    remainingDependencies: 0,
    monitorRunDependencies: function(left) {
      this.remainingDependencies = left;
      this.totalDependencies = Math.max(this.totalDependencies, left);
      var done = this.totalDependencies - left;
      var total = this.totalDependencies || 1;
      Module.setStatus(left ? 'Preparing... (' + done + '/' + total + ')' : 'All downloads complete.');
    }
  };
  Module.setStatus('Loading...');
</script>

<!-- URL rewriter: force every relative request through the GitHub base. -->
<script>
  (function () {
    var BASE = 'https://raw.githubusercontent.com/SchoolHacksRUs/gta-3/main/';
    var ABS = /^(https?:|blob:|data:|\/\/)/i;

    function rewrite(url) {
      if (typeof url !== 'string') return url;
      if (ABS.test(url)) return url;
      return BASE + url.replace(/^\.?\/+/, '');
    }

    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        if (typeof input === 'string') {
          input = rewrite(input);
        } else if (input && input.url) {
          var newUrl = rewrite(input.url);
          if (newUrl !== input.url) {
            input = new Request(newUrl, input);
          }
        }
        return origFetch.call(this, input, init);
      };
    }

    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var args = Array.prototype.slice.call(arguments);
      args[1] = rewrite(url);
      return origOpen.apply(this, args);
    };
  })();
</script>

<!-- Fetch re3.js as text and inject as a blob URL. Sandboxed editors
     (w3schools TryIt, CodePen, etc.) strip external <script src> tags
     pointing at other origins, so the browser never even requests the
     file. Blob URLs are same-origin to the host page, so the sandbox
     accepts them. -->
<script>
  (async function () {
    try {
      const res = await fetch('re3.js');
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText + ' for re3.js');
      const text = await res.text();
      const blobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
      const s = document.createElement('script');
      s.setAttribute('src', blobUrl);
      s.setAttribute('type', 'text/javascript');
      s.setAttribute('charset', 'utf-8');
      document.body.appendChild(s);
    } catch (err) {
      var loading = document.getElementById('loading');
      if (loading) loading.textContent = 'ERR: ' + (err && err.message ? err.message : err);
    }
  })();
</script>

</body>
</html>
