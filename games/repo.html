<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | R.E.P.O</title>
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/genizy/web-port/main/repo/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/genizy/web-port/main/repo/TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="loading-text" style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="unity-container" class="unity-desktop" hidden>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>
    <script>
        // -------------------------------------------------------------
        //  Raw GitHub base. jsDelivr rejects genizy/web-port (many ports
        //  exceed the total-size cap), so all assets come from raw GitHub.
        // -------------------------------------------------------------
        var REMOTE_BASE = "https://raw.githubusercontent.com/genizy/web-port/main/repo/";

        // Intercept fetch so relative paths and any internal loader fetches
        // resolve against raw GitHub.
        var _origFetch = window.fetch;
        window.fetch = function (input, init) {
            var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
            if (url && url.indexOf('http') !== 0 && url.indexOf('blob:') !== 0 && url.indexOf('data:') !== 0) {
                url = REMOTE_BASE + url.replace(/^\.?\/+/, "");
            }
            if (input && input.url && url !== input.url) input = new Request(url, input);
            else if (typeof input === 'string') input = url;
            return _origFetch.call(this, input, init);
        };

        // Load a JS file as a blob with the correct MIME type.
        // Raw GitHub serves .js as text/plain, which browsers refuse to
        // execute as <script src> and Unity refuses to use as a framework.
        async function fetchAsJsBlob(url) {
            var r = await fetch(url);
            if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
            var text = await r.text();
            return URL.createObjectURL(new Blob([text], { type: "application/javascript" }));
        }

        function loadScriptAsBlob(url) {
            return new Promise(function (resolve, reject) {
                fetchAsJsBlob(url).then(function (blobUrl) {
                    var s = document.createElement("script");
                    s.src = blobUrl;
                    s.onload = resolve;
                    s.onerror = function () { reject(new Error("Failed to execute " + url)); };
                    document.head.appendChild(s);
                }).catch(reject);
            });
        }

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        function mergeFiles(fileParts, mimeType) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers, { type: mimeType });
                        resolve(URL.createObjectURL(mergedBlob));
                        return;
                    }
                    fetch(fileParts[index]).then((response) => {
                        if (!response.ok) throw new Error("HTTP " + response.status + " for " + fileParts[index]);
                        return response.arrayBuffer();
                    }).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(REMOTE_BASE + file + ".part" + i);
            }
            return parts;
        }

        (async function () {
            try {
                loadingBar.style.display = "block";

                const [wasmUrl, dataUrl] = await Promise.all([
                    mergeFiles(getParts("Build/NewestBuild.wasm.gz", 1, 3), "application/wasm"),
                    mergeFiles(getParts("Build/NewestBuild.data.gz", 1, 16), "application/octet-stream")
                ]);

                container.hidden = false;
                var buildUrl = REMOTE_BASE + "Build";
                var loaderUrl = buildUrl + "/NewestBuild.loader.js";

                // Framework as a blob (raw GitHub's text/plain MIME blocks it).
                var frameworkBlobUrl = await fetchAsJsBlob(buildUrl + "/NewestBuild.framework.js");

                var config = {
                    dataUrl: dataUrl,
                    frameworkUrl: frameworkBlobUrl,
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: REMOTE_BASE + "StreamingAssets",
                    companyName: "Stupid Game",
                    productName: "R.E.P.O",
                    productVersion: "0.1",
                    showBanner: unityShowBanner
                };

                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    var meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                    document.getElementsByTagName('head')[0].appendChild(meta);
                    container.className = "unity-mobile";
                    canvas.className = "unity-mobile";
                } else {
                    function resizeCanvas() {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        canvas.style.width = window.innerWidth + "px";
                        canvas.style.height = window.innerHeight + "px";
                    }
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);
                }

                await loadScriptAsBlob(loaderUrl);

                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((unityInstance) => {
                    loadingBar.style.display = "none";
                    var lt = document.querySelector("#loading-text");
                    if (lt) lt.remove();
                }).catch((message) => {
                    console.error(message);
                    var lt = document.querySelector("#loading-text");
                    if (lt) lt.textContent = "FAILED: " + message;
                });
            } catch (err) {
                console.error(err);
                var lt = document.querySelector("#loading-text");
                if (lt) lt.textContent = "FAILED: " + (err && err.message ? err.message : err);
            }
        })();
    </script>
</body>

</html>
